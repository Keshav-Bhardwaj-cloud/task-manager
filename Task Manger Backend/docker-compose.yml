services:
  mongo:
    image: mongo:8
    volumes: 
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh","--quiet","--eval","db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    depends_on:
      mongo:
        condition:  service_healthy   
  


  frontend:
    build:
      context: ../Task Manager Frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
    mongo_data:  